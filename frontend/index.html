<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0c" />
    <meta name="description" content="Panel local para administrar NVIDIA DGX Spark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MyDGX</title>
    <script>
      (function () {
        var preference = localStorage.getItem("mydgx-theme-preference");
        if (preference !== "system" && preference !== "light" && preference !== "dark") {
          var legacy = localStorage.getItem("mydgx-theme");
          preference = legacy === "light" || legacy === "dark" ? legacy : "system";
        }
        var dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
